name: EAS

# Phone-friendly EAS driver.
#
# Claude Code remote sessions cannot reach api.expo.dev (gateway policy), and
# driving a Codespace terminal from an iPhone is painful. GitHub Actions runners
# have unrestricted network access, so the EAS CLI work happens here instead:
# runs are triggered and their logs read through the GitHub API, and Tyler only
# ever taps in a browser.
#
# Requires repository secret EXPO_TOKEN (expo.dev -> Access tokens).

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        default: verify
        options:
          - verify
          - configure
          - build
          - usage
          - channels
          - update
          - asc-check
          - asc-bundle-id
          - asc-iap
          - asc-builds
          - submit
      update_message:
        description: 'Message for the EAS Update (used by step: update)'
        required: false
        type: string
        default: "dev client bundle"
      update_branch:
        description: 'Which EAS branch/channel to publish to (step: update). production = TestFlight'
        required: false
        type: choice
        default: production
        options:
          - production
          - development
      confirm_submit:
        description: 'Type SUBMIT to authorize uploading a build to App Store Connect (step: submit)'
        required: false
        type: string
        default: ""
      confirm_build:
        description: 'Type BUILD to authorize an EAS build (quota-limited, ignored for other steps)'
        required: false
        type: string
        default: ""
      build_profile:
        description: 'Which eas.json build profile to use (step: build)'
        required: false
        type: choice
        default: development
        options:
          - development
          - production

concurrency:
  group: eas
  cancel-in-progress: false

jobs:
  eas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      APP_DIR: ${{ github.workspace }}/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check EXPO_TOKEN is present
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::error::EXPO_TOKEN repository secret is not set."
            echo "Create one at https://expo.dev/settings/access-tokens and add it at"
            echo "Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi
          echo "EXPO_TOKEN is set (value never printed)."

      # First run: mobile/ does not exist yet, so reconstruct it from the
      # installer. Later runs reuse the committed project so the EAS projectId
      # and updates config written by `configure` survive.
      - name: Apple API key (optional — enables non-interactive credentials)
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -z "${ASC_API_KEY_P8:-}" ]; then
            echo "No ASC_API_KEY_P8 secret — Apple credential operations will need an interactive session."
            exit 0
          fi
          for v in ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "$(eval echo \"\$$v\")" ]; then
              echo "::error::ASC_API_KEY_P8 is set but $v is missing. All three are required."
              exit 1
            fi
          done

          # eas-cli wants a path, not the contents. Keep it outside the repo so
          # it can never be committed, and readable only by this job.
          KEYDIR="$RUNNER_TEMP/asc"
          mkdir -p "$KEYDIR" && chmod 700 "$KEYDIR"
          KEYFILE="$KEYDIR/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_API_KEY_P8" > "$KEYFILE"
          chmod 600 "$KEYFILE"

          # Shape check only — never the contents.
          if ! head -n1 "$KEYFILE" | grep -q "BEGIN PRIVATE KEY"; then
            echo "::error::That does not look like a .p8 private key. Paste the WHOLE file, including the BEGIN and END lines."
            rm -rf "$KEYDIR"; exit 1
          fi
          echo "  key file written ($(wc -l < "$KEYFILE") lines), key id and issuer id present"

          {
            echo "EXPO_ASC_API_KEY_PATH=$KEYFILE"
            echo "EXPO_ASC_KEY_ID=$ASC_KEY_ID"
            echo "EXPO_ASC_ISSUER_ID=$ASC_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Apple API — check the key, or create the bundle identifier
        if: inputs.step == 'asc-check' || inputs.step == 'asc-bundle-id'
        env:
          NEW_BUNDLE_ID: com.tylerthornbrue.taxtrail
          NEW_BUNDLE_NAME: TaxTrail
          MODE: ${{ inputs.step }}
        run: |
          set -euo pipefail
          if [ -z "${EXPO_ASC_API_KEY_PATH:-}" ]; then
            echo "::error::No Apple API key. Add ASC_API_KEY_P8, ASC_KEY_ID and ASC_ISSUER_ID as repository secrets."
            exit 1
          fi
          pip install --quiet "pyjwt[crypto]" >/dev/null

          cat > /tmp/asc.py <<'PYEOF'
          import json, os, time, urllib.request, urllib.error, jwt

          KEY  = open(os.environ["EXPO_ASC_API_KEY_PATH"]).read()
          KID  = os.environ["EXPO_ASC_KEY_ID"]
          ISS  = os.environ["EXPO_ASC_ISSUER_ID"]
          BASE = "https://api.appstoreconnect.apple.com"

          now = int(time.time())
          token = jwt.encode(
              {"iss": ISS, "iat": now, "exp": now + 900, "aud": "appstoreconnect-v1"},
              KEY, algorithm="ES256", headers={"kid": KID, "typ": "JWT"})

          def call(method, path, body=None):
              req = urllib.request.Request(
                  BASE + path, method=method,
                  data=json.dumps(body).encode() if body else None,
                  headers={"Authorization": f"Bearer {token}",
                           "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=45) as r:
                      return r.status, json.loads(r.read() or b"{}")
              except urllib.error.HTTPError as e:
                  raw = e.read()
                  try: return e.code, json.loads(raw or b"{}")
                  except Exception: return e.code, {"raw": raw[:300].decode("utf-8", "replace")}
              except Exception as e:
                  return 0, {"raw": str(e)}

          def errs(d):
              return "; ".join(f"{x.get('title')}: {x.get('detail')}" for x in d.get("errors", [])) or ""

          print("=== key check (read-only) ===")
          probes = [("apps",       "/v1/apps?limit=20"),
                    ("bundleIds",  "/v1/bundleIds?limit=200"),
                    ("certificates","/v1/certificates?limit=1"),
                    ("profiles",   "/v1/profiles?limit=1")]
          results = {}
          for label, path in probes:
              code, data = call("GET", path)
              results[label] = (code, data)
              print(f"  {label:<14} HTTP {code}  {errs(data)}")

          if results["apps"][0] == 401 or results["bundleIds"][0] == 401:
              print("::error::401 — the key was rejected. Check the Key ID and Issuer ID, "
                    "and that the .p8 contents were pasted whole.")
              raise SystemExit(1)

          code, data = results["apps"]
          if code == 200:
              print("\n=== App Store Connect app records ===")
              for a in data.get("data", []):
                  at = a.get("attributes", {})
                  print(f"  {at.get('name')}  ->  {at.get('bundleId')}   ascAppId={a.get('id')}")

          code, certs = call("GET", "/v1/certificates?limit=200")
          if code == 200:
              print("\n=== certificates on this team ===")
              rows = certs.get("data", [])
              if not rows: print("  (none)")
              for c in rows:
                  at = c.get("attributes", {})
                  print(f"  {str(at.get('certificateType')):<28} {at.get('displayName')}  expires {str(at.get('expirationDate'))[:10]}")

          code, profs = call("GET", "/v1/profiles?limit=200")
          if code == 200:
              print("\n=== provisioning profiles ===")
              rows = profs.get("data", [])
              if not rows: print("  (none)")
              for pr in rows:
                  at = pr.get("attributes", {})
                  print(f"  {str(at.get('profileType')):<28} {at.get('name')}  {at.get('profileState')}")

          code, data = results["bundleIds"]
          if code == 200:
              ids = [b["attributes"]["identifier"] for b in data.get("data", [])]
              print("\n=== bundle identifiers on this team ===")
              for i in sorted(ids):
                  mark = "  <-- new" if i == os.environ["NEW_BUNDLE_ID"] else ""
                  print(f"  {i}{mark}")
              exists = os.environ["NEW_BUNDLE_ID"] in ids
          else:
              print(f"::error::Cannot list bundle identifiers (HTTP {code}). "
                    "The key most likely lacks Admin access — creating identifiers, "
                    "certificates and profiles is Admin-scoped.")
              raise SystemExit(1)

          if os.environ["MODE"] != "asc-bundle-id":
              print("\nKey works. Nothing was changed.")
              raise SystemExit(0)

          print("\n=== create the bundle identifier ===")
          if exists:
              print(f"  {os.environ['NEW_BUNDLE_ID']} already exists — nothing to do.")
              raise SystemExit(0)
          code, data = call("POST", "/v1/bundleIds", {"data": {
              "type": "bundleIds",
              "attributes": {"identifier": os.environ["NEW_BUNDLE_ID"],
                             "name": os.environ["NEW_BUNDLE_NAME"],
                             "platform": "IOS"}}})
          if code in (200, 201):
              print(f"  created {data['data']['attributes']['identifier']}")
              print("  It should now appear in the App Store Connect Bundle ID dropdown.")
          else:
              print(f"::error::Create failed (HTTP {code}). {errs(data)}")
              raise SystemExit(1)
          PYEOF
          python3 /tmp/asc.py

      - name: Materialize project
        run: |
          set -euo pipefail
          if [ -d "$APP_DIR" ]; then
            echo "Using committed mobile/ project."
            cd "$APP_DIR"
            npm install --no-audit --no-fund
          else
            echo "No mobile/ yet - running setup-receiptsnap-mobile.sh."
            bash setup-receiptsnap-mobile.sh
            mkdir -p "$APP_DIR"
            rsync -a --exclude .git --exclude node_modules --exclude ios --exclude android \
              "$HOME/taxtrail-mobile/" "$APP_DIR/"
            cp -R "$HOME/taxtrail-mobile/node_modules" "$APP_DIR/node_modules"
          fi

      - name: Verify (unit tests + TypeScript)
        if: inputs.step != 'usage'
        working-directory: ${{ github.workspace }}/mobile
        run: |
          set -euo pipefail
          npm run test:unit
          npx tsc --noEmit
          echo "TypeScript: clean"

      - name: Identity
        if: inputs.step != 'verify'
        working-directory: ${{ github.workspace }}/mobile
        run: |
          set -euo pipefail
          # `eas whoami` prints two lines - "<username> (authenticated using
          # EXPO_TOKEN)" then the account email. Take the bare username only:
          # $GITHUB_ENV rejects multi-line values, and --account wants the name.
          ACCOUNT="$(npx eas-cli@latest whoami | head -n1 | awk '{print $1}')"
          if [ -z "$ACCOUNT" ]; then
            echo "::error::Could not determine the Expo account from 'eas whoami'."
            exit 1
          fi
          echo "Logged in as: $ACCOUNT"
          echo "EAS_ACCOUNT=$ACCOUNT" >> "$GITHUB_ENV"

      # Answers "how many builds have we actually spent?" — the EAS dashboard is
      # unreachable from Claude Code sessions, so ask the API instead.
      - name: Build usage
        if: inputs.step == 'usage'
        working-directory: ${{ github.workspace }}/mobile
        run: |
          set -euo pipefail
          npx eas-cli@latest build:list --limit 50 --json --non-interactive > builds.json
          python3 - <<'PY'
          import json, collections, datetime
          builds = json.load(open('builds.json'))
          print(f"Total builds on record: {len(builds)}\n")
          by_month = collections.Counter()
          print(f"{'created':<22}{'platform':<10}{'status':<12}{'profile':<14}id")
          print("-" * 92)
          for b in builds:
              created = (b.get('createdAt') or '')[:19].replace('T', ' ')
              by_month[created[:7]] += 1
              print(f"{created:<22}{(b.get('platform') or ''):<10}"
                    f"{(b.get('status') or ''):<12}{(b.get('buildProfile') or ''):<14}{b.get('id')}")
          print("\nBuilds per month:")
          for m, n in sorted(by_month.items()):
              print(f"  {m}: {n}")
          statuses = collections.Counter(b.get('status') for b in builds)
          print("\nBy status:", dict(statuses))

          # Why did the errored ones error?
          #
          # An ERRORED build's log lives on expo.dev, which Claude Code sessions
          # cannot reach — so the one place the reason is written down is the one
          # place the agent debugging it cannot look. build:list carries the
          # error alongside the status and costs nothing extra, so print it. It
          # is the difference between "a build failed" and "it failed in Install
          # pods on a version mismatch", which is the whole of the diagnosis.
          errored = [b for b in builds if b.get('status') == 'ERRORED']
          if errored:
              # The code is the part that says whose fault it was: SERVER_ERROR
              # is Expo's own infrastructure and means simply retry, while
              # XCODE_BUILD_ERROR or UNKNOWN_ERROR happened on the worker and
              # means the diff is at fault. Build 4 hit one of each in eleven
              # minutes, and telling them apart is the whole decision.
              print("\nErrored builds — reason as EAS recorded it:")
              for b in errored[:6]:
                  err = b.get('error') or {}
                  created = (b.get('createdAt') or '')[:19].replace('T', ' ')
                  print(f"  {created}  {b.get('id')}")
                  print(f"    code:    {err.get('errorCode') or '(none recorded)'}")
                  print(f"    message: {err.get('message') or '(none recorded)'}")
          print("\nNote: whether a FAILED build counts against the monthly quota is an")
          print("EAS billing policy question. This lists what EAS recorded; confirm")
          print("remaining quota at https://expo.dev/accounts/tylerthornbrue/settings/billing")
          PY
          rm -f builds.json

      # What would a launching binary actually download?
      #
      # Build 4 crashed on launch, and an OTA is one of the few things that can
      # break a binary that built and signed cleanly: the app checks its channel
      # on startup and runs whatever it finds with a matching runtimeVersion. If
      # a bad update is live, every install crashes and the binary is innocent.
      #
      # Read-only and free. It publishes nothing — deliberately separate from
      # `update`, so diagnosing a crash can never cause one.
      - name: Channels and live updates (read-only)
        if: inputs.step == 'channels'
        working-directory: ${{ github.workspace }}/mobile
        run: |
          set -euo pipefail
          echo "=== runtimeVersion policy in app.json ==="
          python3 -c "import json;a=json.load(open('app.json'))['expo'];print(' runtimeVersion:',a.get('runtimeVersion'));print(' version:',a.get('version'),' buildNumber:',a.get('ios',{}).get('buildNumber'))"
          echo
          echo "=== channels ==="
          npx eas-cli@latest channel:list --non-interactive --json | python3 -c "
          import json,sys
          for c in json.load(sys.stdin):
              print(f\"  {c.get('name')}\")
              for b in (c.get('branchMapping') or {}).get('data') or []:
                  print(f\"    -> branch {b.get('branchId')}\")
          " || npx eas-cli@latest channel:list --non-interactive || true
          echo
          for BR in production development; do
            echo "=== updates on branch: $BR ==="
            npx eas-cli@latest update:list --branch "$BR" --limit 8 --non-interactive --json 2>/dev/null | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          groups=d if isinstance(d,list) else d.get('currentPage') or []
          if not groups: print('  (none)')
          for g in groups:
              us=g.get('updates') or [g]
              for u in us:
                  print(f\"  {str(u.get('createdAt'))[:19]}  rt={u.get('runtimeVersion')}  {u.get('platform')}  {str(u.get('message'))[:52]}\")
                  print(f\"      group={u.get('group')}\")
          " || echo "  (could not read $BR)"
            echo
          done
          echo "An update whose runtimeVersion matches the installed binary WILL be"
          echo "downloaded and run on launch. That is the one way a clean build can"
          echo "crash on a device."

      # Publishes the JS bundle over the air. The channel is baked into each
      # binary at build time, so publishing to the wrong branch is the classic
      # way an update appears to do nothing — this step was hardcoded to
      # `development` and therefore could never reach TestFlight. It now takes
      # the branch as an input and states, before publishing, exactly which
      # binary it is about to reach and which version stamp it carries.
      - name: Publish EAS Update
        if: inputs.step == 'update'
        working-directory: ${{ github.workspace }}/mobile
        env:
          UPDATE_BRANCH: ${{ inputs.update_branch }}
          UPDATE_MESSAGE: ${{ inputs.update_message }}
        run: |
          set -euo pipefail
          BRANCH="$UPDATE_BRANCH"
          echo "================================================================"
          echo " Publishing to EAS branch/channel: $BRANCH"
          case "$BRANCH" in
            production)
              echo " Reaches: the App Store / TestFlight build."
              echo "          bundle com.tylerthornbrue.taxtrail — real testers." ;;
            development)
              echo " Reaches: the ad-hoc dev client only (build 1)."
              echo "          OLD bundle id; purchases and restore do not work there." ;;
          esac
          echo " Version stamp carried by this bundle:"
          grep -E "APP_VERSION|APP_BUILD|JS_REVISION" src/lib/version.ts | sed 's/^/   /'
          echo "================================================================"
          npx eas-cli@latest update \
            --branch "$BRANCH" \
            --message "$UPDATE_MESSAGE" \
            --non-interactive
          echo "--- channel after publish ---"
          npx eas-cli@latest channel:view "$BRANCH" --non-interactive || true

      - name: Configure EAS project + OTA updates
        if: inputs.step == 'configure'
        working-directory: ${{ github.workspace }}/mobile
        run: |
          set -euo pipefail
          npx eas-cli@latest init --account "$EAS_ACCOUNT" --non-interactive
          npx eas-cli@latest update:configure --platform ios --non-interactive
          echo "--- app.json after configure ---"
          cat app.json

      - name: Commit configured project
        if: inputs.step == 'configure'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # create-expo-app runs `git init` in the generated project, so mobile/
          # arrives as a nested repo. Git refuses to index that as plain files
          # ("does not have a commit checked out"), so drop the inner .git.
          rm -rf "$APP_DIR/.git" "$APP_DIR/node_modules" "$APP_DIR/ios" "$APP_DIR/android"
          git add -A mobile
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git checkout -B eas-config
          git commit -m "Add EAS-configured TaxTrail mobile project

          Generated by setup-receiptsnap-mobile.sh, then configured with
          eas init + eas update:configure so the projectId and updates URL
          are durable across sessions."
          git push -u origin eas-config --force

      - name: Preflight
        if: inputs.step == 'build'
        working-directory: ${{ github.workspace }}/mobile
        run: |
          set -euo pipefail
          npx expo-doctor || echo "::warning::expo-doctor reported issues - review before building"
          npx expo prebuild --platform ios --no-install

          # Print every permission string the generated Info.plist carries.
          #
          # CLAUDE.md requires inspecting this after any config-plugin change,
          # because plugins add permissions SILENTLY — expo-image-picker adds a
          # microphone request, expo-location adds always-on location (D-007).
          # For an app whose differentiator is the "Data Not Collected" label,
          # an unexplained permission is corrosive.
          #
          # This used to be impossible: the step deleted ios/ immediately after
          # prebuild, so nobody could read the artifact the rule is about.
          echo "================================================================"
          echo " Info.plist permission strings (every NS*UsageDescription)"
          echo "================================================================"
          PLIST=$(find ios -name "Info.plist" -path "*/TaxTrail/*" | head -1)
          if [ -z "$PLIST" ]; then PLIST=$(find ios -name "Info.plist" | head -1); fi
          if [ -n "$PLIST" ]; then
            python3 - "$PLIST" <<'PYEOF'
          import plistlib, sys
          with open(sys.argv[1], "rb") as f:
              d = plistlib.load(f)
          keys = sorted(k for k in d if k.endswith("UsageDescription"))
          for k in keys:
              print(f"  {k}")
              print(f"      {d[k]}")
          print(f"\n  {len(keys)} permission(s).")
          bonjour = d.get("NSBonjourServices")
          if bonjour:
              print(f"  NSBonjourServices: {bonjour}")
          PYEOF
          else
            echo "::warning::No Info.plist found after prebuild — could not verify permissions."
          fi
          echo "================================================================"

          rm -rf ios
          echo "Preflight complete."

      # Reports the state of the three in-app purchase products. StoreKit only
      # returns a product to the app once App Store Connect considers it
      # complete, so "the paywall shows nothing" is usually a product-state
      # problem rather than a code problem — and the two look identical from
      # inside the app. Read-only and free.
      # Did the binary we submitted actually finish processing, and can it be
      # installed?
      #
      # `eas submit` reports that Apple ACCEPTED the upload, which is not the
      # same thing. Apple then processes it, and processing can fail — invalid
      # entitlements, a missing icon, a bad Info.plist — long after the submit
      # step went green. Until this step existed the project had no way to ask,
      # so the answer arrived as an email Tyler might miss, or as an app that
      # never appeared in TestFlight. That is the same shape as the build 4
      # crash: nothing found it but the person holding the phone (D-062).
      #
      # Read-only and free.
      - name: Apple API — build processing state
        if: inputs.step == 'asc-builds'
        env:
          ASC_APP_ID: "6797163508"
        run: |
          set -euo pipefail
          if [ -z "${EXPO_ASC_API_KEY_PATH:-}" ]; then
            echo "::error::No Apple API key. Needs ASC_API_KEY_P8, ASC_KEY_ID and ASC_ISSUER_ID."
            exit 1
          fi
          pip install --quiet "pyjwt[crypto]" >/dev/null
          python3 - <<'PYEOF'
          import json, os, time, urllib.request, urllib.error, jwt

          KEY  = open(os.environ["EXPO_ASC_API_KEY_PATH"]).read()
          KID  = os.environ["EXPO_ASC_KEY_ID"]
          ISS  = os.environ["EXPO_ASC_ISSUER_ID"]
          APP  = os.environ["ASC_APP_ID"]
          BASE = "https://api.appstoreconnect.apple.com"

          now = int(time.time())
          token = jwt.encode(
              {"iss": ISS, "iat": now, "exp": now + 900, "aud": "appstoreconnect-v1"},
              KEY, algorithm="ES256", headers={"kid": KID, "typ": "JWT"})

          def get(path):
              req = urllib.request.Request(
                  BASE + path, headers={"Authorization": f"Bearer {token}"})
              try:
                  with urllib.request.urlopen(req, timeout=45) as r:
                      return r.status, json.loads(r.read() or b"{}")
              except urllib.error.HTTPError as e:
                  raw = e.read()
                  try: return e.code, json.loads(raw or b"{}")
                  except Exception: return e.code, {"raw": raw[:300].decode("utf-8", "replace")}

          code, data = get(f"/v1/builds?filter[app]={APP}&limit=10&sort=-version")
          print(f"builds  HTTP {code}")
          if code != 200:
              print("::error::Could not read builds from App Store Connect.")
              raise SystemExit(1)

          rows = data.get("data", [])
          if not rows:
              print("No builds on App Store Connect for this app yet.")
              raise SystemExit(0)

          print("\n=== builds, newest first ===")
          stuck = []
          for b in rows:
              at = b.get("attributes", {})
              ver   = at.get("version")
              state = at.get("processingState")
              expired = at.get("expired")
              uploaded = str(at.get("uploadedDate"))[:19]
              note = ""
              if state == "VALID" and not expired:
                  note = "installable"
              elif state == "PROCESSING":
                  note = "still processing — not installable yet"
                  stuck.append(ver)
              elif state in ("FAILED", "INVALID"):
                  note = "*** FAILED PROCESSING — this build can never be installed ***"
                  stuck.append(ver)
              elif expired:
                  note = "expired"
              print(f"  build {str(ver):<4} {str(state):<12} uploaded {uploaded}  {note}")

          bad = [b for b in rows
                 if b.get("attributes", {}).get("processingState") in ("FAILED", "INVALID")]
          if bad:
              print("\n::error::A build failed Apple's processing. It will never appear in "
                    "TestFlight; the fix is a new build, not a resubmit of this one.")
              raise SystemExit(1)
          print("\nNo build has failed processing.")
          PYEOF

      - name: Apple API — in-app purchase state
        if: inputs.step == 'asc-iap'
        run: |
          set -euo pipefail
          if [ -z "${EXPO_ASC_API_KEY_PATH:-}" ]; then
            echo "::error::No Apple API key. Needs ASC_API_KEY_P8, ASC_KEY_ID and ASC_ISSUER_ID."
            exit 1
          fi
          pip install --quiet "pyjwt[crypto]" >/dev/null

          cat > /tmp/asc_iap.py <<'PYEOF'
          import json, os, time, urllib.request, urllib.error, jwt

          KEY  = open(os.environ["EXPO_ASC_API_KEY_PATH"]).read()
          KID  = os.environ["EXPO_ASC_KEY_ID"]
          ISS  = os.environ["EXPO_ASC_ISSUER_ID"]
          BASE = "https://api.appstoreconnect.apple.com"
          APP  = json.load(open("mobile/eas.json"))["submit"]["production"]["ios"]["ascAppId"]

          now = int(time.time())
          token = jwt.encode(
              {"iss": ISS, "iat": now, "exp": now + 900, "aud": "appstoreconnect-v1"},
              KEY, algorithm="ES256", headers={"kid": KID, "typ": "JWT"})

          def get(path):
              req = urllib.request.Request(
                  BASE + path,
                  headers={"Authorization": f"Bearer {token}",
                           "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=45) as r:
                      return r.status, json.loads(r.read() or b"{}")
              except urllib.error.HTTPError as e:
                  raw = e.read()
                  try: return e.code, json.loads(raw or b"{}")
                  except Exception: return e.code, {"raw": raw[:300].decode("utf-8", "replace")}
              except Exception as e:
                  return 0, {"raw": str(e)}

          # A product only reaches the app from these states. Anything else and
          # the paywall will look broken for reasons no amount of JS will fix.
          FETCHABLE = {"READY_TO_SUBMIT", "APPROVED", "WAITING_FOR_REVIEW",
                       "IN_REVIEW", "DEVELOPER_REMOVED_FROM_SALE",
                       "PENDING_BINARY_APPROVAL"}

          print(f"=== app {APP} ===\n")
          problems = []

          print("--- one-time purchases (the lifetime unlock) ---")
          code, data = get(f"/v1/apps/{APP}/inAppPurchasesV2?limit=200")
          print(f"  HTTP {code}")
          if code == 200:
              rows = data.get("data", [])
              if not rows:
                  problems.append("no one-time in-app purchase products exist")
              for p in rows:
                  a = p.get("attributes", {})
                  state = a.get("state")
                  flag = "ok " if state in FETCHABLE else "!! "
                  print(f"  {flag}{a.get('productId')}  type={a.get('inAppPurchaseType')}  state={state}")
                  if state not in FETCHABLE:
                      problems.append(f"{a.get('productId')} is {state}")

          print("\n--- subscriptions (monthly / annual) ---")
          code, data = get(f"/v1/apps/{APP}/subscriptionGroups?limit=50")
          print(f"  groups HTTP {code}")
          if code == 200:
              groups = data.get("data", [])
              if not groups:
                  problems.append("no subscription groups exist")
              for g in groups:
                  gid = g["id"]
                  print(f"  group '{g.get('attributes', {}).get('referenceName')}' ({gid})")
                  cg, dg = get(f"/v1/subscriptionGroups/{gid}/subscriptionGroupLocalizations?limit=50")
                  if cg == 200:
                      glocs = dg.get("data", [])
                      if not glocs:
                          problems.append(f"subscription group {gid} has no localization")
                          print("    !! group has no localization (needs a display name)")
                      for gl in glocs:
                          ga = gl.get("attributes", {})
                          note = ""
                          if "receiptsnap" in str(ga.get("name", "")).lower():
                              note = "  <- still says ReceiptSnap, users see this"
                          print(f"    group name [{ga.get('locale')}] = {ga.get('name')!r}{note}")
                  else:
                      print(f"    could not read group localizations (HTTP {cg})")
                  c2, d2 = get(f"/v1/subscriptionGroups/{gid}/subscriptions?limit=200")
                  print(f"    HTTP {c2}")
                  if c2 == 200:
                      subs = d2.get("data", [])
                      if not subs:
                          problems.append(f"subscription group {gid} has no products")
                      for sub in subs:
                          a = sub.get("attributes", {})
                          state = a.get("state")
                          pid = a.get("productId")
                          flag = "ok " if state in FETCHABLE else "!! "
                          print(f"    {flag}{pid}  period={a.get('subscriptionPeriod')}  state={state}")
                          if state in FETCHABLE:
                              continue
                          problems.append(f"{pid} is {state}")

                          # Say which field is missing, not just that one is.
                          missing = []
                          c3, d3 = get(f"/v1/subscriptions/{sub['id']}/subscriptionLocalizations?limit=50")
                          if c3 == 200:
                              locs = d3.get("data", [])
                              if not locs:
                                  missing.append("display name + description (no localizations at all)")
                              for loc in locs:
                                  la = loc.get("attributes", {})
                                  gaps = [f for f in ("name", "description") if not la.get(f)]
                                  if gaps:
                                      missing.append(f"{la.get('locale')}: {' and '.join(gaps)}")
                                  elif "receiptsnap" in str(la.get("name", "")).lower():
                                      missing.append(f"{la.get('locale')}: name still says ReceiptSnap "
                                                     f"({la.get('name')!r}) — users see this")
                          else:
                              missing.append(f"could not read localizations (HTTP {c3})")

                          c4, d4 = get(f"/v1/subscriptions/{sub['id']}/prices?limit=50")
                          if c4 == 200:
                              if not d4.get("data", []):
                                  missing.append("price (no price set in any territory)")
                          else:
                              missing.append(f"could not read prices (HTTP {c4})")

                          # A subscription also needs a review screenshot and a
                          # territory availability record, and its GROUP needs
                          # its own localization. Any of those missing shows up
                          # only as MISSING_METADATA on the subscription.
                          c5, d5 = get(f"/v1/subscriptions/{sub['id']}/appStoreReviewScreenshot")
                          if c5 == 200:
                              if not d5.get("data"):
                                  missing.append("App Store review screenshot")
                              else:
                                  sa = d5["data"].get("attributes", {})
                                  if sa.get("assetDeliveryState", {}).get("state") != "COMPLETE":
                                      missing.append(f"review screenshot upload incomplete "
                                                     f"({sa.get('assetDeliveryState', {}).get('state')})")
                          elif c5 == 404:
                              missing.append("App Store review screenshot (none attached)")
                          else:
                              missing.append(f"could not read review screenshot (HTTP {c5})")

                          c6, d6 = get(f"/v1/subscriptions/{sub['id']}/subscriptionAvailability")
                          if c6 == 200:
                              if not d6.get("data"):
                                  missing.append("territory availability")
                          elif c6 == 404:
                              missing.append("territory availability (not configured)")
                          else:
                              missing.append(f"could not read availability (HTTP {c6})")

                          if not missing:
                              # Everything checked came back populated, so dump
                              # what Apple actually holds rather than guess again.
                              c7, d7 = get(f"/v1/subscriptions/{sub['id']}")
                              print(f"         nothing obvious missing — raw attributes:")
                              for k, v in sorted((d7.get("data", {}).get("attributes") or {}).items()):
                                  print(f"           {k} = {v!r}")

                          for m in missing:
                              print(f"         needs: {m}")

          print("\n=== verdict ===")
          if problems:
              for p in problems:
                  print(f"  BLOCKED: {p}")
              print("\n  A product in MISSING_METADATA needs its localization, price or review "
                    "screenshot filled in before StoreKit will hand it to the app. The paywall "
                    "cannot be tested until every product is fetchable.")
          else:
              print("  All products are in a fetchable state. The paywall should load them.")
          PYEOF
          python3 /tmp/asc_iap.py

      # A production build that reuses a build number already on App Store
      # Connect is dead on arrival: Apple rejects the upload, so the build is
      # spent for nothing. Checking costs one free API read and happens BEFORE
      # `eas build` runs, so a caught mistake costs no quota. See D-039.
      - name: Build number preflight (production only)
        if: inputs.step == 'build' && inputs.build_profile == 'production'
        working-directory: ${{ github.workspace }}/mobile
        run: |
          set -euo pipefail
          if [ -z "${EXPO_ASC_API_KEY_PATH:-}" ]; then
            echo "::warning::No Apple API key, so the build number could not be checked against App Store Connect. Proceeding."
            exit 0
          fi
          pip install --quiet "pyjwt[crypto]" >/dev/null

          cat > /tmp/buildnum.py <<'PYEOF'
          import json, os, sys, time, urllib.request, urllib.error, urllib.parse, jwt

          KEY  = open(os.environ["EXPO_ASC_API_KEY_PATH"]).read()
          KID  = os.environ["EXPO_ASC_KEY_ID"]
          ISS  = os.environ["EXPO_ASC_ISSUER_ID"]
          BASE = "https://api.appstoreconnect.apple.com"

          app  = json.load(open("app.json"))["expo"]
          MARKETING = str(app["version"])
          LOCAL     = str(app["ios"]["buildNumber"])
          ASC_APP   = str(json.load(open("eas.json"))["submit"]["production"]["ios"]["ascAppId"])

          print(f"app.json      version {MARKETING}  buildNumber {LOCAL}")
          print(f"ascAppId      {ASC_APP}")

          now = int(time.time())
          token = jwt.encode(
              {"iss": ISS, "iat": now, "exp": now + 900, "aud": "appstoreconnect-v1"},
              KEY, algorithm="ES256", headers={"kid": KID, "typ": "JWT"})

          def get(path):
              req = urllib.request.Request(
                  BASE + path,
                  headers={"Authorization": f"Bearer {token}",
                           "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=45) as r:
                      return r.status, json.loads(r.read() or b"{}")
              except urllib.error.HTTPError as e:
                  raw = e.read()
                  try: return e.code, json.loads(raw or b"{}")
                  except Exception: return e.code, {"raw": raw[:300].decode("utf-8", "replace")}
              except Exception as e:
                  return 0, {"raw": str(e)}

          def key(v):
              # eas-cli allows up to three dot-separated integers; compare as a tuple.
              try: return tuple(int(x) for x in str(v).split("."))
              except ValueError: return None

          # /v1/builds carries the BUILD number in attributes.version; the
          # marketing version lives on the related preReleaseVersion. Ask for
          # the prerelease record for this marketing version, then its builds.
          taken, source = [], None
          q = urllib.parse.urlencode({"filter[app]": ASC_APP,
                                      "filter[version]": MARKETING, "limit": 10})
          code, data = get(f"/v1/preReleaseVersions?{q}")
          print(f"  preReleaseVersions   HTTP {code}")
          if code == 200:
              source = "preReleaseVersions"
              for pre in data.get("data", []):
                  c2, d2 = get(f"/v1/preReleaseVersions/{pre['id']}/builds?limit=200")
                  print(f"  builds for {pre['id']}   HTTP {c2}")
                  if c2 == 200:
                      taken += [b.get("attributes", {}).get("version") for b in d2.get("data", [])]
          if source is None:
              # Fallback: every build for the app, filtered client-side.
              q = urllib.parse.urlencode({"filter[app]": ASC_APP,
                                          "include": "preReleaseVersion", "limit": 200})
              code, data = get(f"/v1/builds?{q}")
              print(f"  builds (fallback)    HTTP {code}")
              if code == 200:
                  source = "builds"
                  pre_by_id = {i["id"]: i.get("attributes", {}).get("version")
                               for i in data.get("included", [])
                               if i.get("type") == "preReleaseVersions"}
                  for b in data.get("data", []):
                      rel = b.get("relationships", {}).get("preReleaseVersion", {}).get("data") or {}
                      if pre_by_id.get(rel.get("id")) == MARKETING:
                          taken.append(b.get("attributes", {}).get("version"))

          if source is None:
              print("::warning::Could not read builds from App Store Connect, so the build "
                    "number was not verified. Proceeding — if the upload is rejected as a "
                    "duplicate, bump expo.ios.buildNumber and rebuild.")
              sys.exit(0)

          taken = [t for t in taken if t]
          print(f"build numbers already on App Store Connect for {MARKETING}: "
                f"{sorted(taken, key=lambda v: key(v) or ()) or 'none'}")

          local = key(LOCAL)
          if local is None:
              print(f"::error::expo.ios.buildNumber is {LOCAL!r}, which is not a number.")
              sys.exit(1)

          clash = [t for t in taken if key(t) is not None and key(t) >= local]
          if clash:
              highest = max(key(t) for t in taken if key(t) is not None)
              nxt = highest[:-1] + (highest[-1] + 1,)
              print(f"::error::buildNumber {LOCAL} is not above what Apple already has "
                    f"for {MARKETING} (highest: {'.'.join(str(x) for x in highest)}). The "
                    f"upload would be rejected and the build wasted. Set "
                    f"expo.ios.buildNumber to {'.'.join(str(x) for x in nxt)} in "
                    f"mobile/app.json, set APP_BUILD to match in "
                    f"mobile/src/lib/version.ts, commit, and re-run.")
              sys.exit(1)

          print(f"OK — build number {LOCAL} is free for version {MARKETING}.")
          PYEOF
          python3 /tmp/buildnum.py

      - name: EAS build (iOS development client)
        if: inputs.step == 'build'
        working-directory: ${{ github.workspace }}/mobile
        env:
          CONFIRM_BUILD: ${{ inputs.confirm_build }}
          BUILD_PROFILE: ${{ inputs.build_profile }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM_BUILD" != "BUILD" ]; then
            echo "::error::Build not authorized. Re-run with confirm_build set to BUILD."
            exit 1
          fi
          PROFILE="$BUILD_PROFILE"
          if [ -n "${EXPO_ASC_API_KEY_PATH:-}" ]; then
            echo "Apple auth: App Store Connect API key — credentials can be created non-interactively."
          else
            echo "::warning::No ASC API key. If this profile has no credentials yet, the build will fail rather than prompt."
          fi
          npx eas-cli@latest build \
            --profile "$PROFILE" \
            --platform ios \
            --non-interactive \
            --message "TaxTrail v1.0.0 · $PROFILE"

      - name: Submit to App Store Connect (TestFlight)
        if: inputs.step == 'submit'
        working-directory: ${{ github.workspace }}/mobile
        env:
          CONFIRM_SUBMIT: ${{ inputs.confirm_submit }}
        run: |
          set -euo pipefail
          # Gated like the build: this uploads a binary to Apple under Tyler's
          # developer account, which is not something to trigger by accident.
          if [ "$CONFIRM_SUBMIT" != "SUBMIT" ]; then
            echo "::error::Submit not authorized. Re-run with confirm_submit set to SUBMIT."
            exit 1
          fi
          if [ -z "${EXPO_ASC_API_KEY_PATH:-}" ]; then
            echo "::error::No Apple API key. Submitting needs ASC_API_KEY_P8, ASC_KEY_ID and ASC_ISSUER_ID."
            exit 1
          fi
          npx eas-cli@latest submit \
            --platform ios \
            --profile production \
            --latest \
            --non-interactive

      - name: Shred the Apple key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc" || true
