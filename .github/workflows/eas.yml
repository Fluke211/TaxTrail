name: EAS

# Phone-friendly EAS driver.
#
# Claude Code remote sessions cannot reach api.expo.dev (gateway policy), and
# driving a Codespace terminal from an iPhone is painful. GitHub Actions runners
# have unrestricted network access, so the EAS CLI work happens here instead:
# runs are triggered and their logs read through the GitHub API, and Tyler only
# ever taps in a browser.
#
# Requires repository secret EXPO_TOKEN (expo.dev -> Access tokens).

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        default: verify
        options:
          - verify
          - configure
          - build
          - usage
          - update
      update_message:
        description: 'Message for the EAS Update (used by step: update)'
        required: false
        type: string
        default: "dev client bundle"
      confirm_build:
        description: 'Type BUILD to authorize an EAS build (quota-limited, ignored for other steps)'
        required: false
        type: string
        default: ""

concurrency:
  group: eas
  cancel-in-progress: false

jobs:
  eas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      APP_DIR: ${{ github.workspace }}/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check EXPO_TOKEN is present
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::error::EXPO_TOKEN repository secret is not set."
            echo "Create one at https://expo.dev/settings/access-tokens and add it at"
            echo "Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi
          echo "EXPO_TOKEN is set (value never printed)."

      # First run: mobile/ does not exist yet, so reconstruct it from the
      # installer. Later runs reuse the committed project so the EAS projectId
      # and updates config written by `configure` survive.
      - name: Materialize project
        run: |
          set -euo pipefail
          if [ -d "$APP_DIR" ]; then
            echo "Using committed mobile/ project."
            cd "$APP_DIR"
            npm install --no-audit --no-fund
          else
            echo "No mobile/ yet - running setup-receiptsnap-mobile.sh."
            bash setup-receiptsnap-mobile.sh
            mkdir -p "$APP_DIR"
            rsync -a --exclude .git --exclude node_modules --exclude ios --exclude android \
              "$HOME/taxtrail-mobile/" "$APP_DIR/"
            cp -R "$HOME/taxtrail-mobile/node_modules" "$APP_DIR/node_modules"
          fi

      - name: Verify (unit tests + TypeScript)
        if: inputs.step != 'usage'
        working-directory: ${{ github.workspace }}/mobile
        run: |
          set -euo pipefail
          npm run test:unit
          npx tsc --noEmit
          echo "TypeScript: clean"

      - name: Identity
        if: inputs.step != 'verify'
        working-directory: ${{ github.workspace }}/mobile
        run: |
          set -euo pipefail
          # `eas whoami` prints two lines - "<username> (authenticated using
          # EXPO_TOKEN)" then the account email. Take the bare username only:
          # $GITHUB_ENV rejects multi-line values, and --account wants the name.
          ACCOUNT="$(npx eas-cli@latest whoami | head -n1 | awk '{print $1}')"
          if [ -z "$ACCOUNT" ]; then
            echo "::error::Could not determine the Expo account from 'eas whoami'."
            exit 1
          fi
          echo "Logged in as: $ACCOUNT"
          echo "EAS_ACCOUNT=$ACCOUNT" >> "$GITHUB_ENV"

      # Answers "how many builds have we actually spent?" — the EAS dashboard is
      # unreachable from Claude Code sessions, so ask the API instead.
      - name: Build usage
        if: inputs.step == 'usage'
        working-directory: ${{ github.workspace }}/mobile
        run: |
          set -euo pipefail
          npx eas-cli@latest build:list --limit 50 --json --non-interactive > builds.json
          python3 - <<'PY'
          import json, collections, datetime
          builds = json.load(open('builds.json'))
          print(f"Total builds on record: {len(builds)}\n")
          by_month = collections.Counter()
          print(f"{'created':<22}{'platform':<10}{'status':<12}{'profile':<14}id")
          print("-" * 92)
          for b in builds:
              created = (b.get('createdAt') or '')[:19].replace('T', ' ')
              by_month[created[:7]] += 1
              print(f"{created:<22}{(b.get('platform') or ''):<10}"
                    f"{(b.get('status') or ''):<12}{(b.get('buildProfile') or ''):<14}{b.get('id')}")
          print("\nBuilds per month:")
          for m, n in sorted(by_month.items()):
              print(f"  {m}: {n}")
          statuses = collections.Counter(b.get('status') for b in builds)
          print("\nBy status:", dict(statuses))
          print("\nNote: whether a FAILED build counts against the monthly quota is an")
          print("EAS billing policy question. This lists what EAS recorded; confirm")
          print("remaining quota at https://expo.dev/accounts/tylerthornbrue/settings/billing")
          PY
          rm -f builds.json

      # Publishes the JS bundle to the `development` channel so the dev client can
      # launch it without a Metro dev server — which cannot be kept running from
      # CI, and is impractical to babysit from a phone.
      - name: Publish EAS Update
        if: inputs.step == 'update'
        working-directory: ${{ github.workspace }}/mobile
        run: |
          set -euo pipefail
          npx eas-cli@latest update \
            --branch development \
            --message "${{ inputs.update_message }}" \
            --non-interactive
          echo "--- channels ---"
          npx eas-cli@latest channel:view development --non-interactive || true

      - name: Configure EAS project + OTA updates
        if: inputs.step == 'configure'
        working-directory: ${{ github.workspace }}/mobile
        run: |
          set -euo pipefail
          npx eas-cli@latest init --account "$EAS_ACCOUNT" --non-interactive
          npx eas-cli@latest update:configure --platform ios --non-interactive
          echo "--- app.json after configure ---"
          cat app.json

      - name: Commit configured project
        if: inputs.step == 'configure'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # create-expo-app runs `git init` in the generated project, so mobile/
          # arrives as a nested repo. Git refuses to index that as plain files
          # ("does not have a commit checked out"), so drop the inner .git.
          rm -rf "$APP_DIR/.git" "$APP_DIR/node_modules" "$APP_DIR/ios" "$APP_DIR/android"
          git add -A mobile
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git checkout -B eas-config
          git commit -m "Add EAS-configured TaxTrail mobile project

          Generated by setup-receiptsnap-mobile.sh, then configured with
          eas init + eas update:configure so the projectId and updates URL
          are durable across sessions."
          git push -u origin eas-config --force

      - name: Preflight
        if: inputs.step == 'build'
        working-directory: ${{ github.workspace }}/mobile
        run: |
          set -euo pipefail
          npx expo-doctor || echo "::warning::expo-doctor reported issues - review before building"
          npx expo prebuild --platform ios --no-install
          rm -rf ios
          echo "Preflight complete."

      - name: EAS build (iOS development client)
        if: inputs.step == 'build'
        working-directory: ${{ github.workspace }}/mobile
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm_build }}" != "BUILD" ]; then
            echo "::error::Build not authorized. Re-run with confirm_build set to BUILD."
            exit 1
          fi
          npx eas-cli@latest build \
            --profile development \
            --platform ios \
            --non-interactive \
            --message "TaxTrail v1.0.0 (build 1) dev client"
