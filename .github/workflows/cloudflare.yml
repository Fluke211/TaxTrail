name: Cloudflare

# Phone-friendly Cloudflare driver, same shape as eas.yml.
#
# There is no MCP server for Cloudflare DNS, Email Routing or Pages — the
# connected "Cloudflare Developer Platform" server only covers KV/R2/D1/Workers.
# The REST API is reachable, so an agent drives it from here: runs are triggered
# and their logs read through the GitHub API, and Tyler only ever taps in a
# browser. See DECISIONS.md D-031.
#
# Requires repository secrets:
#   CLOUDFLARE_API_TOKEN   scoped token, never printed
#   CLOUDFLARE_ACCOUNT_ID  account identifier (not a secret, but kept together)

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        default: status
        options:
          - status
          - email
          - pages
          - verify
      forward_to:
        description: "Destination inbox for email routing (step: email). Must already be a VERIFIED destination address."
        required: false
        type: string
        default: ""

concurrency:
  group: cloudflare
  cancel-in-progress: false

env:
  ZONE: taxtrail.app
  PAGES_PROJECT: taxtrail
  CF_API: https://api.cloudflare.com/client/v4

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Resolve zone and check the token
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # Informational only. Do NOT assert a length: Cloudflare has changed
          # the token format, and an earlier version of this file asserted 40
          # characters from memory and produced a confidently wrong diagnosis.
          # The only trustworthy test is whether a real call succeeds.
          python3 - <<'PY'
          import os
          t = os.environ['TOKEN']
          print(f"  secret length: {len(t)}")
          if t != t.strip():
              print(f"::warning::The secret has {len(t)-len(t.strip())} chars of surrounding whitespace, "
                    "which alone can cause an auth failure. Re-save it with no trailing newline or space.")
          PY

          TRIMMED=$(printf '%s' "$TOKEN" | tr -d '[:space:]')

          # Health check by CAPABILITY, not by /user/tokens/verify.
          # That endpoint is user-scoped: an ACCOUNT-owned token is perfectly
          # valid yet 401s there. Resolving the zone is the first thing every
          # other step needs anyway, so it is the honest test.
          code=$(curl -sS -o /tmp/zone.json -w '%{http_code}' \
            -H "Authorization: Bearer $TRIMMED" "$CF_API/zones?name=$ZONE")
          echo "  GET /zones?name=$ZONE -> HTTP $code"

          if [ "$code" = "200" ]; then
            ZID=$(python3 -c "
          import json,sys
          d=json.load(open('/tmp/zone.json'))
          r=d.get('result') or []
          if not r:
              print('::error::Authenticated fine, but zone $ZONE is not visible to this token. Add Zone -> Zone -> Read, and make sure the token includes this zone in its resources.', file=sys.stderr)
              sys.exit(1)
          print(r[0]['id'])")
            echo "ZONE_ID=$ZID" >> "$GITHUB_ENV"
            echo "  zone resolved — the token works."
          else
            echo "::error::Cloudflare returned HTTP $code resolving the zone."
            python3 -c "
          import json
          try: d=json.load(open('/tmp/zone.json'))
          except Exception: d={}
          for e in d.get('errors',[]): print('  -', e.get('code'), e.get('message'))" || true
            if [ "$code" = "403" ]; then
              echo "  403 is a PERMISSIONS problem, not a bad token. The token needs Zone -> Zone -> Read on $ZONE."
            elif [ "$code" = "401" ]; then
              echo "  401 means the credential itself was not accepted: wrong value, expired, or an IP restriction on the token."
            fi
            exit 1
          fi

          # Secondary signal only — never fatal. Tells us which kind of token
          # this is, which matters for reading Cloudflare's own docs later.
          uc=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $TRIMMED" "$CF_API/user/tokens/verify")
          if [ "$uc" = "200" ]; then
            echo "  token type: user-owned"
          else
            echo "  token type: account-owned (user endpoint returns $uc, which is expected and harmless)"
          fi

      - name: Status — what exists right now
        if: inputs.step == 'status' || inputs.step == 'verify'
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          T=$(printf '%s' "$TOKEN" | tr -d '[:space:]')

          # Report the HTTP code and any error body for every call. An earlier
          # version printed "(no rules)" whether the call succeeded with an
          # empty list or failed outright, which hid a permissions problem.
          probe() {  # $1 = label, $2 = url
            code=$(curl -sS -o /tmp/p.json -w '%{http_code}' -H "Authorization: Bearer $T" "$2")
            printf '  %-46s HTTP %s\n' "$1" "$code"
            python3 -c "
          import json
          try: d=json.load(open('/tmp/p.json'))
          except Exception: raise SystemExit
          for e in (d.get('errors') or []): print('      error', e.get('code'), '-', e.get('message'))" || true
            cp /tmp/p.json "/tmp/last.json" 2>/dev/null || true
          }

          echo "=== DNS ==="
          probe "GET /zones/:id/dns_records" "$CF_API/zones/$ZONE_ID/dns_records?per_page=100"
          python3 -c "
          import json
          try: rs=json.load(open('/tmp/last.json')).get('result') or []
          except Exception: rs=[]
          if not rs: print('    (no DNS records on this zone)')
          for r in sorted(rs, key=lambda x:(x['type'],x['name'])):
              print(f\"    {r['type']:<6} {r['name']:<40} {str(r['content'])[:56]}\")
          print(f'    MX={sum(1 for r in rs if r[\"type\"]==\"MX\")} TXT={sum(1 for r in rs if r[\"type\"]==\"TXT\")}')"

          echo; echo "=== Email Routing — which API shape answers ==="
          probe "zone   /email/routing"          "$CF_API/zones/$ZONE_ID/email/routing"
          probe "zone   /email/routing/rules"    "$CF_API/zones/$ZONE_ID/email/routing/rules?per_page=50"
          probe "acct   /email/routing/addresses" "$CF_API/accounts/$ACC/email/routing/addresses?per_page=50"

          echo; echo "=== Pages (account-scoped — likely needs its own permission) ==="
          probe "acct   /pages/projects"          "$CF_API/accounts/$ACC/pages/projects"

          echo; echo "Reading the codes: 200 = allowed. 403 or a 'Authentication"
          echo "failed' 400 on ONE resource while others return 200 means the"
          echo "token is fine but lacks that specific permission."

      - name: Email — enable routing, write DNS, create rules
        if: inputs.step == 'email'
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FORWARD_TO: ${{ inputs.forward_to }}
          ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          T=$(printf '%s' "$TOKEN" | tr -d '[:space:]')
          if [ -z "${FORWARD_TO:-}" ]; then
            echo "No forward_to given — enabling routing and writing DNS only."
            echo "Rules need a VERIFIED destination address; re-run with forward_to once there is one."
          fi

          echo "==> Enabling Email Routing (this writes the MX, SPF and DKIM records)"
          curl -sS -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" \
            "$CF_API/zones/$ZONE_ID/email/routing/enable" -d '{}' -o /tmp/enable.json || true
          python3 -c "
          import json
          d=json.load(open('/tmp/enable.json'))
          print('  success:', d.get('success'))
          for e in d.get('errors',[]): print('  note:', e.get('message'))"

          echo; echo "==> DNS records now on the zone"
          curl -sS -H "Authorization: Bearer $T" \
            "$CF_API/zones/$ZONE_ID/dns_records?per_page=100" -o /tmp/dns2.json
          python3 -c "
          import json
          rs=json.load(open('/tmp/dns2.json')).get('result') or []
          if not rs: print('  (still none — the enable call did not take)')
          for r in sorted(rs, key=lambda x:(x['type'],x['name'])):
              print(f\"  {r['type']:<6} {r['name']:<40} {str(r['content'])[:56]}\")"

          if [ -z "${FORWARD_TO:-}" ]; then
            echo; echo "Stopping here — no destination address was supplied, so no rules were created."
            exit 0
          fi

          echo; echo "==> Destination address"
          code=$(curl -sS -o /tmp/addr.json -w '%{http_code}' -H "Authorization: Bearer $T" \
            "$CF_API/accounts/$ACC/email/routing/addresses?per_page=50")
          if [ "$code" = "403" ]; then
            echo "  Cannot read destination addresses (403). The token lacks"
            echo "  Account -> Email Routing Addresses. Add the address in the dashboard instead;"
            echo "  the rule below will be created but stays DISABLED until it is verified."
          else
            # Create it if absent. THIS is what makes Cloudflare send the
            # verification email - nothing before this point does.
            known=$(python3 -c "
          import json,os
          rs=json.load(open('/tmp/addr.json')).get('result') or []
          print('yes' if any((a.get('email') or '').lower()==os.environ['FORWARD_TO'].strip().lower() for a in rs) else 'no')")
            if [ "$known" = "no" ]; then
              echo "  Not a destination yet — adding it, which sends the verification email."
              curl -sS -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" \
                "$CF_API/accounts/$ACC/email/routing/addresses" \
                -d "{\"email\":\"$FORWARD_TO\"}" -o /tmp/newaddr.json || true
              python3 -c "
          import json
          d=json.load(open('/tmp/newaddr.json'))
          print('  add:', 'requested — CHECK THE INBOX FOR A VERIFICATION LINK' if d.get('success') else [e.get('message') for e in d.get('errors',[])])"
              curl -sS -H "Authorization: Bearer $T" \
                "$CF_API/accounts/$ACC/email/routing/addresses?per_page=50" -o /tmp/addr.json || true
            fi
            python3 - <<'PY2'
          import json, os
          want = os.environ['FORWARD_TO'].strip().lower()
          rs = json.load(open('/tmp/addr.json')).get('result') or []
          for a in rs:
              print(f"  {a.get('email'):<40} verified={'yes' if a.get('verified') else 'NO'}")
          m = [a for a in rs if (a.get('email') or '').lower() == want]
          if not m:
              print(f"::warning::{want} is not a destination address yet — Cloudflare must email it a verification link first.")
          elif not m[0].get('verified'):
              print(f"::warning::{want} is not verified yet. Click the link Cloudflare emailed it.")
          else:
              print(f"  {want} is verified.")
          PY2
          fi

          echo; echo "==> Routing rules"
          curl -sS -X POST -H "Authorization: Bearer $T" -H "Content-Type: application/json" \
            "$CF_API/zones/$ZONE_ID/email/routing/rules" \
            -d "{\"name\":\"support\",\"enabled\":true,
                 \"matchers\":[{\"type\":\"literal\",\"field\":\"to\",\"value\":\"support@$ZONE\"}],
                 \"actions\":[{\"type\":\"forward\",\"value\":[\"$FORWARD_TO\"]}]}" -o /tmp/rule.json || true
          python3 -c "
          import json
          d=json.load(open('/tmp/rule.json'))
          print('  support@:', 'created' if d.get('success') else [e.get('message') for e in d.get('errors',[])])"

          curl -sS -X PUT -H "Authorization: Bearer $T" -H "Content-Type: application/json" \
            "$CF_API/zones/$ZONE_ID/email/routing/rules/catch_all" \
            -d "{\"name\":\"catch-all\",\"enabled\":true,
                 \"matchers\":[{\"type\":\"all\"}],
                 \"actions\":[{\"type\":\"forward\",\"value\":[\"$FORWARD_TO\"]}]}" -o /tmp/ca.json || true
          python3 -c "
          import json
          d=json.load(open('/tmp/ca.json'))
          print('  catch-all:', 'set' if d.get('success') else [e.get('message') for e in d.get('errors',[])])"

      - name: Pages — create the project and deploy site/
        if: inputs.step == 'pages'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ACC="$CLOUDFLARE_ACCOUNT_ID"

          echo "==> Ensuring Pages project '$PAGES_PROJECT' exists (direct upload)"
          code=$(curl -sS -o /tmp/proj.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$CF_API/accounts/$ACC/pages/projects/$PAGES_PROJECT")
          if [ "$code" != "200" ]; then
            curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              "$CF_API/accounts/$ACC/pages/projects" \
              -d "{\"name\":\"$PAGES_PROJECT\",\"production_branch\":\"main\"}" -o /tmp/proj.json
            python3 -c "
          import json;d=json.load(open('/tmp/proj.json'))
          print('  create:', 'ok' if d.get('success') else [e.get('message') for e in d.get('errors',[])])"
          else
            echo "  already exists"
          fi

          echo; echo "==> Deploying site/"
          npx --yes wrangler@latest pages deploy site \
            --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true

          echo; echo "==> Attaching custom domain $ZONE"
          curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            "$CF_API/accounts/$ACC/pages/projects/$PAGES_PROJECT/domains" \
            -d "{\"name\":\"$ZONE\"}" -o /tmp/dom.json || true
          python3 -c "
          import json;d=json.load(open('/tmp/dom.json'))
          print('  ', 'attached' if d.get('success') else [e.get('message') for e in d.get('errors',[])])"

      - name: Verify — what the outside world sees
        if: inputs.step == 'verify' || inputs.step == 'pages' || inputs.step == 'email'
        run: |
          set -uo pipefail
          echo "=== public DNS ==="
          for t in MX TXT A; do
            echo "  $t:"
            curl -sS -H 'accept: application/dns-json' \
              "https://cloudflare-dns.com/dns-query?name=$ZONE&type=$t" \
            | python3 -c "
          import json,sys
          a=json.load(sys.stdin).get('Answer') or []
          print(*['    '+str(x.get('data'))[:90] for x in a], sep='\n') if a else print('    (none)')"
          done
          echo; echo "=== site ==="
          for u in "https://$ZONE/" "https://$ZONE/privacy.html" "https://$ZONE/support.html"; do
            printf '  %-40s ' "$u"
            curl -sSL --max-time 20 -o /dev/null -w 'http=%{http_code}\n' "$u" || echo "unreachable"
          done
